name: Bug 报告
description: 报告可复现的缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 请描述实际行为与预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 执行……
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python、Node、浏览器及相关版本。
  - type: checkboxes
    id: safety
    attributes:
      label: 数据安全
      options:
        - label: 我已移除 API Key、Token、个人信息和真实供应商响应。
          required: true

