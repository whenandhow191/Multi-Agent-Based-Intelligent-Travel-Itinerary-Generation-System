name: 功能建议
description: 提议新的能力或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户场景和当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、边界和可验证结果。
    validations:
      required: true
  - type: input
    id: checkpoint
    attributes:
      label: 关联检查点
      placeholder: 例如 C18

