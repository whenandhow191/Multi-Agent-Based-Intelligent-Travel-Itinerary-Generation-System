name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travel_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_agent_test
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
          run_install: false
      - name: Install locked dependencies
        run: |
          uv sync --active --all-groups --frozen
          pnpm install --frozen-lockfile
      - name: Verify migrations and release gates
        run: |
          uv run --active alembic upgrade head
          pnpm check
          pnpm demo
          docker compose config --quiet
      - name: Build deployable images
        run: docker compose build api web
      - name: Publish immutable GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
