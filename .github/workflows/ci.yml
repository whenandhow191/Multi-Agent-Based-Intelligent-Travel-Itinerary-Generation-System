name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, type and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: travel_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travel_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/travel_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
          run_install: false
      - name: Install Python dependencies
        run: uv sync --active --all-groups --frozen
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply PostgreSQL migrations
        run: uv run --active alembic upgrade head
      - name: Run the same checks as local development
        run: pnpm check
